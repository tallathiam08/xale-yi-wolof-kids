name: Test ADIA Wolof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adia:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer PyTorch et ADIA
        run: |
          python -m pip install --upgrade pip
          pip install torch
          pip install git+https://github.com/huggingface/parler-tts.git
          pip install transformers soundfile accelerate sentencepiece

      - name: Générer une phrase Wolof
        run: |
          python test_adia_wolof.py

      - name: Vérifier l'audio
        run: |
          test -s output/adia_wolof_test.wav
          file output/adia_wolof_test.wav
          echo "✅ Audio ADIA valide"

      - name: Conserver l'audio
        uses: actions/upload-artifact@v4
        with:
          name: adia-wolof-test
          path: output/adia_wolof_test.wav
          retention-days: 7
