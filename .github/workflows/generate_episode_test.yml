name: Generate Episode Test

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Générer un nouvel épisode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          python generate_episode_github.py

      - name: Vérifier le fichier généré
        run: |
          test -s output/episode_github_generated.json
          python -m json.tool output/episode_github_generated.json > /dev/null
          echo "✅ JSON de l'épisode valide"

      - name: Sauvegarder l'épisode comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: episode-wolof-generated
          path: output/episode_github_generated.json
