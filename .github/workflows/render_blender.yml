name: Generate Full Xale Yi Episode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer dépendances Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            libglx0 \
            libglx-mesa0 \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxfixes3 \
            libxkbcommon0 \
            libsm6 \
            libice6 \
            libdbus-1-3

          ffmpeg -version
          ffprobe -version

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch
          pip install git+https://github.com/huggingface/parler-tts.git
          pip install transformers soundfile accelerate sentencepiece

      - name: Télécharger Blender 4.5.14
        run: |
          mkdir -p .tools

          curl -fL \
            -o .tools/blender.tar.xz \
            https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz

          tar -xJf \
            .tools/blender.tar.xz \
            -C .tools

          echo \
            "BLENDER_BIN=$PWD/.tools/blender-4.5.14-linux-x64/blender" \
            >> "$GITHUB_ENV"

          "$PWD/.tools/blender-4.5.14-linux-x64/blender" \
            --version

      - name: Générer l'épisode Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_episode_github.py

      - name: Vérifier le scénario
        run: |
          test -s output/episode_github_generated.json

          python - <<'PY'
          import json

          path = "output/episode_github_generated.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          scenes = data["scenes"]

          assert len(scenes) == 60
          assert sum(
              s["duration_hint"]
              for s in scenes
          ) == 300

          assert all(
              len(s["dialogue"]) == 2
              for s in scenes
          )

          assert all(
              len(s["characters"]) >= 2
              for s in scenes
          )

          print("✅ 60 scènes")
          print("✅ 300 secondes")
          print("✅ 120 dialogues")
          PY

      - name: Construire les scènes Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          "$BLENDER_BIN" \
            --background \
            --python blender_engine/build_episode_blender.py

      - name: Rendre les scènes Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu"
        run: |
          "$BLENDER_BIN" \
            --background \
            --python blender_engine/render_episode_github.py

      - name: Vérifier la vidéo Blender
        run: |
          test -s output/blender/episode_silent.mp4

          ffmpeg \
            -v error \
            -i output/blender/episode_silent.mp4 \
            -f null -

          echo "✅ Vidéo Blender valide"

      - name: Générer les 120 voix ADIA
        env:
          ADIA_LIMIT: "1000"
        run: |
          python generate_adia_episode_audio.py

      - name: Préparer les voix ADIA
        run: |
          python prepare_adia_audio.py

      - name: Vérifier les 120 WAV
        run: |
          COUNT=$(find output/wolof_audio -name "*.wav" | wc -l | tr -d ' ')

          echo "🎙️ WAV : $COUNT"

          test "$COUNT" -eq 120

      - name: Accélérer légèrement les voix
        env:
          DIALOGUE_SPEED: "1.10"
        run: |
          python retime_adia_audio.py

      - name: Générer musique originale
        run: |
          mkdir -p output/free_build

          python generate_kids_music.py \
            --duration 300 \
            --output output/free_build/kids_music.wav

      - name: Assembler épisode complet
        run: |
          python assemble_full_episode.py

      - name: Vérifier épisode final
        run: |
          test -s output/final/episode_final.mp4
          test -s output/final/episode.srt

          ffmpeg \
            -v error \
            -i output/final/episode_final.mp4 \
            -f null -

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/final/episode_final.mp4)

          echo "🎬 Durée finale : ${DURATION}s"

          python - <<'PY'
          import subprocess

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "output/final/episode_final.mp4",
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          duration = float(
              result.stdout.strip()
          )

          assert 295 <= duration <= 305

          print(
              f"✅ Durée finale valide : "
              f"{duration:.2f}s"
          )
          PY

      - name: Conserver l'épisode
        uses: actions/upload-artifact@v4
        with:
          name: xale-yi-full-episode-${{ github.run_number }}
          path: |
            output/final/episode_final.mp4
            output/final/episode.srt
            output/episode_github_generated.json
            output/adia_audio/manifest.json
            output/blender/manifest.json
          retention-days: 7
