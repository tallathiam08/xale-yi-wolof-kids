name: Generate Full Xale Yi Episode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            libglx0 \
            libglx-mesa0 \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxfixes3 \
            libxkbcommon0 \
            libsm6 \
            libice6 \
            libdbus-1-3

          ffmpeg -version

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Télécharger Blender
        run: |
          mkdir -p .tools

          curl -fL \
            -o .tools/blender.tar.xz \
            https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz

          tar -xJf \
            .tools/blender.tar.xz \
            -C .tools

          echo "BLENDER_BIN=$PWD/.tools/blender-4.5.14-linux-x64/blender" \
            >> "$GITHUB_ENV"

          "$PWD/.tools/blender-4.5.14-linux-x64/blender" \
            --version

      - name: Générer l'épisode Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_episode_github.py

      - name: Vérifier le JSON
        run: |
          test -s output/episode_github_generated.json

          python - <<'PY'
          import json

          with open(
              "output/episode_github_generated.json",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          scenes = d["scenes"]

          assert len(scenes) == 60
          assert sum(
              s["duration_hint"]
              for s in scenes
          ) == 300

          assert all(
              len(s["dialogue"]) == 2
              for s in scenes
          )

          print("✅ 60 scènes / 300 secondes / 120 dialogues")
          PY

      - name: Construire les scènes Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          "$BLENDER_BIN" \
            --background \
            --python blender_engine/build_episode_blender.py

      - name: Rendre les 60 scènes
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu"
        run: |
          "$BLENDER_BIN" \
            --background \
            --python blender_engine/render_episode_github.py

      - name: Vérifier le MP4
        run: |
          test -s output/blender/episode_silent.mp4

          ffmpeg \
            -v error \
            -i output/blender/episode_silent.mp4 \
            -f null -

          echo "✅ Épisode Blender valide"

      - name: Conserver la production
        uses: actions/upload-artifact@v4
        with:
          name: xale-yi-blender-episode-${{ github.run_number }}
          path: |
            output/episode_github_generated.json
            output/blender/episode_silent.mp4
            output/blender/manifest.json
          retention-days: 7
