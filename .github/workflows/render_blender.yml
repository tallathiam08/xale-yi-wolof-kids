name: Render Blender Scene

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            libglx0 \
            libglx-mesa0 \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxfixes3 \
            libxkbcommon0 \
            libsm6 \
            libice6 \
            libdbus-1-3 \
            libxxf86vm1 \
            libxxf86vm1

          echo "✅ Dépendances installées"
          ffmpeg -version

      - name: Télécharger Blender 4.5.14
        run: |
          mkdir -p .tools

          curl -fL \
            -o .tools/blender.tar.xz \
            https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz

          tar -xJf .tools/blender.tar.xz -C .tools

          BLENDER_DIR=".tools/blender-4.5.14-linux-x64"

          echo "BLENDER_BIN=$PWD/$BLENDER_DIR/blender" >> "$GITHUB_ENV"

          "$PWD/$BLENDER_DIR/blender" --version

      - name: Générer la scène Blender
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p blender_engine/renders

          "$BLENDER_BIN" \
            --background \
            --python blender_engine/blender_episode_engine.py

      - name: Rendre la scène en MP4
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"

          "$BLENDER_BIN" \
            --background \
            --python blender_engine/render_scene_github.py

      - name: Vérifier le MP4
        run: |
          test -s blender_engine/renders/xale_scene_github.mp4

          ffmpeg \
            -v error \
            -i blender_engine/renders/xale_scene_github.mp4 \
            -f null -

          echo "✅ MP4 valide"
          ls -lh blender_engine/renders/xale_scene_github.mp4

      - name: Conserver la vidéo
        uses: actions/upload-artifact@v4
        with:
          name: xale-yi-blender-scene-${{ github.run_number }}
          path: blender_engine/renders/xale_scene_github.mp4
          retention-days: 7
