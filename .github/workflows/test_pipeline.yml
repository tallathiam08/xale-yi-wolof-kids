name: Test Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compiler les scripts
        run: |
          python -m py_compile \
            config.py \
            dialogue.py \
            episode_automation.py \
            episode_automation_v2.py \
            episode_generator.py \
            generate_episode_audio.py \
            main.py \
            make_animatic.py \
            pipeline.py \
            postprocess_episode.py \
            run_episode.py \
            youtube_upload.py

      - name: Vérifier les secrets
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$ELEVENLABS_API_KEY" && echo "✅ ELEVENLABS_API_KEY présente" || { echo "❌ ELEVENLABS_API_KEY absente"; exit 1; }
          test -n "$GEMINI_API_KEY" && echo "✅ GEMINI_API_KEY présente" || { echo "❌ GEMINI_API_KEY absente"; exit 1; }

      - name: Test terminé
        run: echo "✅ Dépendances et scripts Python validés sur GitHub Actions"
