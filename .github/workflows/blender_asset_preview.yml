name: Xale Yi Asset Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer dépendances graphiques
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            libglx0 \
            libglx-mesa0 \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxfixes3 \
            libxkbcommon0 \
            libsm6 \
            libice6 \
            libdbus-1-3

      - name: Installer Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Vérifier les fichiers du moteur
        run: |
          test -f blender_engine/blender_2d_asset_engine.py
          test -f blender_engine/render_asset_preview.py

          echo "✅ Moteur Blender présent"
          echo "===== CHARACTERS ====="
          find blender_engine/assets/characters \
            -type f \
            -name "*.png" \
            | sort

          echo ""
          echo "===== BACKGROUNDS ====="
          find blender_engine/assets/backgrounds \
            -type f \
            | sort

      - name: Créer la scène test
        run: |
          mkdir -p blender_engine/scenes

          cat > blender_engine/scenes/test_scene.json <<'JSON'
          {
            "scene_type": "music_dance",
            "location": "school",
            "camera": "dance",
            "music": true,
            "characters": [
              {
                "name": "Samba",
                "action": "dance",
                "emotion": "happy"
              },
              {
                "name": "Ibrahima",
                "action": "talk",
                "emotion": "happy"
              },
              {
                "name": "Awa",
                "action": "dance",
                "emotion": "excited"
              },
              {
                "name": "Toto",
                "action": "jump",
                "emotion": "funny"
              }
            ]
          }
          JSON

          test -s blender_engine/scenes/test_scene.json

          echo "✅ test_scene.json créé"
          cat blender_engine/scenes/test_scene.json

      - name: Recadrer les assets personnages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path(
              "blender_engine/assets/characters"
          )

          count = 0

          for path in sorted(root.glob("*/*.png")):
              img = Image.open(
                  path
              ).convert("RGBA")

              alpha = img.getchannel("A")
              bbox = alpha.getbbox()

              if bbox:
                  cropped = img.crop(bbox)

                  margin = 8

                  canvas = Image.new(
                      "RGBA",
                      (
                          cropped.width + margin * 2,
                          cropped.height + margin * 2,
                      ),
                      (0, 0, 0, 0),
                  )

                  canvas.paste(
                      cropped,
                      (margin, margin),
                      cropped,
                  )

                  canvas.save(path)

                  print(
                      f"✅ {path}: "
                      f"{img.size} -> {canvas.size}"
                  )

                  count += 1

          print(
              f"✅ {count} assets recadrés"
          )
          PY

      - name: Télécharger Blender 4.5.14
        run: |
          mkdir -p .tools

          curl -fL \
            -o .tools/blender.tar.xz \
            https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz

          tar -xJf \
            .tools/blender.tar.xz \
            -C .tools

          echo \
            "BLENDER_BIN=$PWD/.tools/blender-4.5.14-linux-x64/blender" \
            >> "$GITHUB_ENV"

          "$PWD/.tools/blender-4.5.14-linux-x64/blender" \
            --version

      - name: Construire la scène avec les vrais assets
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu"
        run: |
          rm -f \
            blender_engine/renders/xale_asset_scene.blend

          "$BLENDER_BIN" \
            --background \
            --python blender_engine/blender_2d_asset_engine.py

          test -s \
            blender_engine/renders/xale_asset_scene.blend

          echo "✅ xale_asset_scene.blend créé"

      - name: Rendre UNE image
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu"
        run: |
          rm -f \
            blender_engine/renders/xale_asset_preview.png

          "$BLENDER_BIN" \
            --background \
            blender_engine/renders/xale_asset_scene.blend \
            --python blender_engine/render_asset_preview.py

          test -s \
            blender_engine/renders/xale_asset_preview.png

          echo "✅ Preview PNG créée"

      - name: Vérifier la preview
        run: |
          echo "===== PREVIEW ====="

          file \
            blender_engine/renders/xale_asset_preview.png

          ls -lh \
            blender_engine/renders/xale_asset_preview.png

          echo "✅ PREVIEW VALIDE"

      - name: Préparer artifact
        run: |
          rm -rf artifact
          mkdir -p artifact

          cp \
            blender_engine/renders/xale_asset_preview.png \
            artifact/

          cp \
            blender_engine/renders/xale_asset_scene.blend \
            artifact/

          cp \
            blender_engine/scenes/test_scene.json \
            artifact/

          echo "===== ARTIFACT ====="

          find artifact \
            -type f \
            -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xale-yi-assets-preview-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
