name: Xale Yi Asset Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer les dépendances graphiques
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            libglx0 \
            libglx-mesa0 \
            libx11-6 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxfixes3 \
            libxkbcommon0 \
            libsm6 \
            libice6 \
            libdbus-1-3

      - name: Télécharger Blender 4.5.14
        run: |
          mkdir -p .tools

          curl -fL \
            -o .tools/blender.tar.xz \
            https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz

          tar -xJf \
            .tools/blender.tar.xz \
            -C .tools

          echo "BLENDER_BIN=$PWD/.tools/blender-4.5.14-linux-x64/blender" \
            >> "$GITHUB_ENV"

      - name: Construire la scène avec les vrais assets
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu"
        run: |
          "$BLENDER_BIN" \
            --background \
            --python blender_engine/blender_2d_asset_engine.py

      - name: Rendre UNE image
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu"
        run: |
          "$BLENDER_BIN" \
            --background \
            --python blender_engine/render_asset_preview.py

      - name: Vérifier la preview
        run: |
          echo "===== RENDERS ====="
          find blender_engine/renders \
            -maxdepth 1 \
            -type f \
            -print \
            -exec ls -lh {} \;

          echo ""
          echo "===== PREVIEW ====="

          test -f \
            blender_engine/renders/xale_asset_preview.png

          test -s \
            blender_engine/renders/xale_asset_preview.png

          file \
            blender_engine/renders/xale_asset_preview.png

          echo "✅ preview.png existe et n'est pas vide"

      - name: Créer un paquet preview
        run: |
          mkdir -p artifact

          cp \
            blender_engine/renders/xale_asset_preview.png \
            artifact/xale_asset_preview.png

          cp \
            blender_engine/renders/xale_asset_scene.blend \
            artifact/xale_asset_scene.blend

          cp \
            blender_engine/scenes/test_scene.json \
            artifact/test_scene.json

          ls -lh artifact/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xale-yi-assets-preview-${{ github.run_number }}
          path: ${{ github.workspace }}/artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
