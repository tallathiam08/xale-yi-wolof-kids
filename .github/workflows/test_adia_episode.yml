name: Test ADIA Episode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer ADIA
        run: |
          python -m pip install --upgrade pip
          pip install torch
          pip install git+https://github.com/huggingface/parler-tts.git
          pip install transformers soundfile accelerate sentencepiece

      - name: Générer 3 dialogues Wolof avec ADIA
        run: |
          python generate_adia_test_only.py

      - name: Vérifier les audios
        run: |
          test -s output/adia_audio_test/manifest.json

          COUNT=$(find output/adia_audio_test -name "*.wav" | wc -l | tr -d ' ')

          echo "🎙️ Audios générés : $COUNT"

          test "$COUNT" -eq 3

          echo "✅ 3 audios ADIA générés"

      - name: Conserver les audios
        uses: actions/upload-artifact@v4
        with:
          name: adia-episode-test
          path: output/adia_audio_test/
          retention-days: 7
